<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theremin Painter</title>
<!--
  THEREMIN PAINTER - web app side
  ================================
  A single self-contained page. Open it in Chrome or Edge (Web Serial needs
  a user click + a Chromium browser). No server, no install, no build step.

  HOW IT WORKS
  1. Click "Connect Arduino" and pick the UNO's serial port.
  2. The Arduino streams lines like  D:42,P:512,B:0  ten times a second.
  3. This page parses them and turns them into music + painting:
       distance (ultrasonic) -> musical pitch + brush height
       potentiometer         -> paint color (hue)
       button                -> stamp a permanent blob on the canvas
  4. Press the button on the breadboard to stamp notes, then "Play stamps"
     to loop them back as a sequencer. Hit "Record" to capture a shareable video.

  REMIX ZONES (marked with ★ below) - safe places to vibe-code variations:
  ★ the musical scale, ★ brush behavior, ★ stamp art, ★ color mapping.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #111;
               font-family: system-ui, sans-serif; color: #eee; }
  #panel {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(10,10,10,.78); border: 1px solid #444; border-radius: 12px;
    padding: 12px 16px; max-width: 320px; backdrop-filter: blur(4px);
  }
  #panel h1 { font-size: 20px; margin: 0 0 8px; }
  #panel button {
    font-size: 14px; margin: 4px 4px 4px 0; padding: 8px 12px;
    border-radius: 8px; border: 1px solid #666; background: #222; color: #eee;
    cursor: pointer;
  }
  #panel button:hover { background: #333; }
  #panel button.on { background: #1c5c2e; border-color: #3a8f52; }
  #status  { margin-top: 8px; font-size: 13px; color: #ffb74d; }
  #status.ok { color: #7CFC98; }
  #readout { margin-top: 6px; font-size: 13px; font-family: monospace; color: #9adcff; }
  #note    { margin-top: 4px; font-size: 15px; }
  #swatch  { display:inline-block; width:14px; height:14px; border-radius:50%;
             border:1px solid #888; vertical-align:-2px; margin-right:6px; }
  #hint { margin-top: 8px; font-size: 12px; color: #aaa; line-height: 1.5; }
  canvas { display: block; }
</style>
</head>
<body>

<div id="panel">
  <h1>&#127912; Theremin Painter</h1>
  <button id="connectBtn">Connect Arduino</button>
  <button id="soundBtn" class="on">Sound: on</button><br>
  <button id="seqBtn">▶ Play stamps</button>
  <button id="clearBtn">Clear</button>
  <button id="recBtn">● Record</button>
  <div id="dl"></div>
  <div id="status">&#9679; not connected</div>
  <div id="readout">D: -- &nbsp; P: ---- &nbsp; B: -</div>
  <div id="note"><span id="swatch"></span><span id="noteName">--</span></div>
  <div id="hint">
    Wave your hand over the ultrasonic sensor.<br>
    Turn the knob for color. Press the button to stamp.<br>
    Play stamps loops your dots into a beat. Record saves a video to share.
  </div>
</div>

<script>
/* ==========================================================================
   ★ REMIX ZONE 1 - THE MUSICAL SCALE
   C major pentatonic across two octaves. Swap these arrays for any scale you
   like (e.g. minor pentatonic, blues). Frequencies in Hz. The Arduino sketch
   uses the same note NAMES - keep the order identical on both sides!
   ========================================================================== */
const SCALE_FREQS = [261.63, 293.66, 329.63, 392.00, 440.00,
                     523.25, 587.33, 659.25, 783.99, 880.00];
const SCALE_NAMES = ["C4","D4","E4","G4","A4","C5","D5","E5","G5","A5"];

/* Sensor ranges. The Arduino sends D:0 when no hand is detected. */
const MIN_CM = 5, MAX_CM = 60;   // playing zone in centimeters
const DEAD_LOW = 4, DEAD_HIGH = 70; // outside this -> silence, brush parks

/* ==========================================================================
   State
   ========================================================================== */
let port = null, reader = null, connected = false;
let dist = null;      // cm, null until first reading
let pot  = 512;       // 0..1023
let btn  = 0, prevBtn = 0;

let audioCtx = null, osc = null, gainNode = null, soundOn = true;
let seqOsc = null, seqGain = null;   // sequencer's own voice, so the hand can play over it
let brushX = 0;                 // brush sweeps left -> right, then wraps
const trail = [];               // recent brush points (fading tail)
const TRAIL_LEN = 160;
let stamps = null;              // p5.Graphics layer: permanent stamped art
let lastHue = 0;

/* sequencer + recorder state */
let seqNotes = [];              // {x, y, step} - one per stamped dot
let seqPlaying = false, playheadX = 0, lastPlayheadX = 0;
const SEQ_LOOP_SEC = 8;         // one left-to-right sweep = 8 seconds
let hits = [];                  // visual pulse rings on triggered dots
let audioDest = null;           // MediaStreamDestination for recording
let rec = null, recChunks = [];

/* ==========================================================================
   ★ REMIX ZONE 2 - SENSOR MAPPING
   How raw sensor numbers become music and color. Change the math here to
   change the instrument.
   ========================================================================== */
function distToStep(d) {
  if (d === null || d < DEAD_LOW || d > DEAD_HIGH) return -1;
  const c = Math.min(MAX_CM, Math.max(MIN_CM, d));
  return Math.round((c - MIN_CM) * (SCALE_FREQS.length - 1) / (MAX_CM - MIN_CM));
}
function potToHue(p) { return Math.round(p / 1023 * 359); }

/* Same color names as the Arduino's colorName() - keep the ranges in sync! */
function colorName(h) {
  if (h < 15 || h >= 345) return "Red";
  if (h < 45)  return "Orange";
  if (h < 75)  return "Yellow";
  if (h < 150) return "Green";
  if (h < 195) return "Cyan";
  if (h < 255) return "Blue";
  if (h < 285) return "Purple";
  return "Pink";
}

/* ==========================================================================
   Serial - Web Serial API. Needs a user gesture (the Connect button).
   Parses lines like "D:42,P:512,B:0" and ignores anything malformed.
   ========================================================================== */
const lineRE = /^D:(\d+),P:(\d+),B:([01])$/;

function parseLine(line) {
  const m = lineRE.exec(line);
  if (!m) return;                       // malformed -> ignore silently
  dist = parseInt(m[1], 10);
  pot  = Math.min(1023, Math.max(0, parseInt(m[2], 10)));
  btn  = parseInt(m[3], 10);
}

async function connectSerial() {
  if (!("serial" in navigator)) {
    setStatus("Web Serial not available - use Chrome or Edge.", false);
    return;
  }
  try {
    ensureAudio();                        // browsers need a gesture for audio
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 9600 });

    connected = true;
    setStatus("connected - wave your hand!", true);
    document.getElementById("connectBtn").classList.add("on");
    document.getElementById("connectBtn").textContent = "Connected ✓";

    const decoder = new TextDecoderStream();
    port.readable.pipeTo(decoder.writable);
    reader = decoder.readable.getReader();

    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      const parts = buf.split("\n");
      buf = parts.pop();                  // keep the incomplete tail
      for (const raw of parts) parseLine(raw.trim());
    }
  } catch (err) {
    setStatus("serial error: " + err.message, false);
  }
}

/* ==========================================================================
   Audio - one triangle oscillator, pitch from the scale, gain follows hand.
   ========================================================================== */
function ensureAudio() {
  if (audioCtx) { if (audioCtx.state === "suspended") audioCtx.resume(); return; }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  osc = audioCtx.createOscillator();
  osc.type = "triangle";
  gainNode = audioCtx.createGain();
  gainNode.gain.value = 0;
  osc.connect(gainNode).connect(audioCtx.destination);
  audioDest = audioCtx.createMediaStreamDestination();
  gainNode.connect(audioDest);
  seqOsc = audioCtx.createOscillator();   // second voice: the sequencer
  seqOsc.type = "triangle";
  seqGain = audioCtx.createGain();
  seqGain.gain.value = 0;
  seqOsc.connect(seqGain).connect(audioCtx.destination);
  seqGain.connect(audioDest);
  seqOsc.start();
  osc.start();
}

function updateAudio(step) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  if (step >= 0 && soundOn) {
    osc.frequency.setTargetAtTime(SCALE_FREQS[step], t, 0.03);
    gainNode.gain.setTargetAtTime(0.16, t, 0.05);
  } else {
    gainNode.gain.setTargetAtTime(0.0, t, 0.08);
  }
}

/* ==========================================================================
   Sequencer - the stamped dots become a looping beat. A playhead sweeps
   left to right; every dot it crosses plays its note.
   ========================================================================== */
function pluck(step) {
  if (!audioCtx || !soundOn) return;
  const t = audioCtx.currentTime;
  seqOsc.frequency.setTargetAtTime(SCALE_FREQS[step], t, 0.01);
  seqGain.gain.cancelScheduledValues(t);
  seqGain.gain.setValueAtTime(0.001, t);
  seqGain.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
  seqGain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
}

/* ==========================================================================
   ★ REMIX ZONE 3 - STAMP ART
   What happens when the button is pressed. Draw anything into `stamps`
   (the permanent layer): shapes, text, emoji...
   ========================================================================== */
function stamp(x, y, hue, noteName) {
  stamps.noStroke();
  stamps.drawingContext.shadowBlur = 30;
  stamps.drawingContext.shadowColor = color(hue, 90, 100).toString();
  stamps.fill(hue, 90, 95, 220);          // bold blob in the paint color
  stamps.circle(x, y, 90);
  stamps.fill(hue, 90, 100, 255);         // bright ring
  stamps.circle(x, y, 46);
  stamps.drawingContext.shadowBlur = 0;   // text stays crisp
  stamps.fill(0, 0, 100);
  stamps.textAlign(CENTER, CENTER);
  stamps.textSize(22);
  stamps.text(noteName, x, y);            // the note, stamped forever
}

/* ==========================================================================
   p5.js - canvas, brush trail, sequencer playhead.
   ========================================================================== */
function setup() {
  const c = createCanvas(windowWidth, windowHeight);
  c.parent(document.body);
  colorMode(HSB, 360, 100, 100, 255);
  stamps = createGraphics(windowWidth, windowHeight);
  stamps.colorMode(HSB, 360, 100, 100, 255);
  textFont("system-ui");
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }

function draw() {
  /* --- background: dark gradient + faint wash of the knob's color --- */
  background(230, 40, 10);
  noStroke();
  fill(lastHue, 60, 100, 16);   // like the LED's light spilling on the page
  rect(0, 0, width, height);

  image(stamps, 0, 0);                    // permanent stamped art

  /* --- brush --- */
  const step = distToStep(dist);
  const hue  = potToHue(pot);
  lastHue = hue;

  if (step >= 0) {
    const y = map(dist, MIN_CM, MAX_CM, height - 60, 60); // near = high
    brushX += 3.2;                        // ★ REMIX: brush speed / path
    if (brushX > width + 20) brushX = -20;

    trail.push({ x: brushX, y, hue });
    if (trail.length > TRAIL_LEN) trail.shift();

    /* fading tail - with neon glow */
    noStroke();
    drawingContext.shadowBlur = 24;
    for (let i = 0; i < trail.length; i++) {
      const p = trail[i];
      const a = map(i, 0, trail.length, 0, 230);
      const s = map(i, 0, trail.length, 2, 26);
      drawingContext.shadowColor = color(p.hue, 90, 100).toString();
      fill(p.hue, 85, 100, a);
      circle(p.x, p.y, s);
    }
    drawingContext.shadowBlur = 0;
    /* brush head */
    stroke(0, 0, 100); strokeWeight(2); noFill();
    circle(brushX, y, 34);
  } else {
    trail.length = 0;                     // hand gone -> tail evaporates
  }

  /* --- button: stamp on rising edge --- */
  if (btn === 1 && prevBtn === 0 && step >= 0) {
    const y = map(dist, MIN_CM, MAX_CM, height - 60, 60);
    stamp(brushX, y, hue, SCALE_NAMES[step]);
    seqNotes.push({ x: brushX, y, step });   // remember it for the sequencer
  }
  prevBtn = btn;

  /* --- sequencer: playhead sweeps left to right, dots become a beat --- */
  if (seqPlaying) {
    lastPlayheadX = playheadX;
    playheadX += width / (SEQ_LOOP_SEC * 60);
    let wrapped = false;
    if (playheadX >= width) { playheadX -= width; wrapped = true; }
    for (const n of seqNotes) {
      const hit = wrapped
        ? (n.x > lastPlayheadX || n.x <= playheadX)
        : (n.x > lastPlayheadX && n.x <= playheadX);
      if (hit) {
        pluck(n.step);
        hits.push({ x: n.x, y: n.y, t: millis() });
      }
    }
    stroke(0, 0, 100, 140); strokeWeight(2);   // playhead line
    line(playheadX, 0, playheadX, height);
  }
  updateAudio(step);

  /* hit flashes: expanding rings where the playhead struck */
  hits = hits.filter(h => millis() - h.t < 500);
  for (const h of hits) {
    const a = map(millis() - h.t, 0, 500, 200, 0);
    const s = map(millis() - h.t, 0, 500, 46, 120);
    noFill(); stroke(0, 0, 100, a); strokeWeight(3);
    circle(h.x, h.y, s);
  }

  updateReadout(step, hue);
}

/* --- on-screen readout --- */
function updateReadout(step, hue) {
  const r = document.getElementById("readout");
  r.innerHTML = "D: " + (dist === null ? "--" : dist) +
                "&nbsp; P: " + String(pot).padStart(4, " ") +
                "&nbsp; B: " + btn;
  document.getElementById("noteName").textContent =
    (step >= 0 ? SCALE_NAMES[step] : "--") + "  ·  " + colorName(hue);
  document.getElementById("swatch").style.background =
    "hsl(" + hue + ",90%,55%)";
}

function setStatus(msg, ok) {
  const el = document.getElementById("status");
  el.textContent = "● " + msg;
  el.classList.toggle("ok", !!ok);
}

/* --- buttons --- */
document.getElementById("connectBtn").addEventListener("click", connectSerial);

/* --- sequencer transport --- */
document.getElementById("seqBtn").addEventListener("click", (e) => {
  ensureAudio();
  seqPlaying = !seqPlaying;
  playheadX = 0; lastPlayheadX = 0;
  e.target.textContent = seqPlaying ? "■ Stop" : "▶ Play stamps";
  e.target.classList.toggle("on", seqPlaying);
  if (!seqPlaying) hits = [];
  setStatus(seqPlaying
    ? "playing " + seqNotes.length + " stamped notes - loop is " + SEQ_LOOP_SEC + "s"
    : "connected - wave your hand!", seqPlaying || connected);
});

/* --- clear the canvas and the note list --- */
document.getElementById("clearBtn").addEventListener("click", () => {
  stamps.clear();
  seqNotes = [];
  hits = [];
  setStatus("canvas cleared", true);
});

/* --- record the canvas (+ audio) to a shareable .webm --- */
document.getElementById("recBtn").addEventListener("click", (e) => {
  if (rec) {                                // stop
    rec.stop();
    e.target.textContent = "● Record";
    e.target.classList.remove("on");
    return;
  }
  try {
    ensureAudio();
    const canvasEl = document.querySelector("canvas");
    const stream = canvasEl.captureStream(30);
    const tracks = [...stream.getVideoTracks()];
    if (audioDest) tracks.push(...audioDest.stream.getAudioTracks());
    recChunks = [];
    rec = new MediaRecorder(new MediaStream(tracks), { mimeType: "video/webm" });
    rec.ondataavailable = (ev) => { if (ev.data.size) recChunks.push(ev.data); };
    rec.onstop = () => {
      const url = URL.createObjectURL(new Blob(recChunks, { type: "video/webm" }));
      const dl = document.getElementById("dl");
      dl.innerHTML = "";
      const a = document.createElement("a");
      a.href = url;
      a.download = "theremin-painter.webm";
      a.textContent = "⬇ Download recording";
      a.style.cssText = "display:inline-block;margin-top:8px;color:#9adcff;";
      dl.appendChild(a);
      rec = null;
      setStatus("recording ready - download it below", true);
    };
    rec.start();
    e.target.textContent = "■ Stop";
    e.target.classList.add("on");
    setStatus("recording…", true);
  } catch (err) {
    setStatus("record error: " + err.message, false);
  }
});

document.getElementById("soundBtn").addEventListener("click", (e) => {
  soundOn = !soundOn;
  e.target.textContent = soundOn ? "Sound: on" : "Sound: off";
  e.target.classList.toggle("on", soundOn);
});
</script>
</body>
</html>
